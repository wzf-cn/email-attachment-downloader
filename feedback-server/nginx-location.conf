# Include inside the existing HTTPS server block. Never proxy the admin port.
location = /mail-feedback/api/feedback {
    limit_req zone=mail_feedback burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8891/api/feedback;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 20s;
    proxy_connect_timeout 5s;
    access_log off;
}
location = /mail-feedback/health {
    proxy_pass http://127.0.0.1:8891/health;
    access_log off;
}
location /mail-feedback/ { return 404; }
