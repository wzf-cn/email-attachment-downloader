name: Publish Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Validate version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/MailIntake.Desktop/MailIntake.Desktop.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version differ' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install NSIS
        run: choco install nsis --version=3.12 -y --no-progress
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -MakeNsis 'C:\Program Files (x86)\NSIS\makensis.exe' -Version $env:RELEASE_VERSION
      - name: Create release checksums
        shell: pwsh
        run: |
          $items = @("artifacts/MailIntake-Setup-$env:RELEASE_VERSION.exe", 'artifacts/MailIntake-win-x64.zip')
          $items | ForEach-Object { $h = Get-FileHash $_; $h.Hash.ToLower() + '  ' + (Split-Path $_ -Leaf) } | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
      - name: Publish release and attachments
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "artifacts/MailIntake-Setup-$env:RELEASE_VERSION.exe" artifacts/MailIntake-win-x64.zip artifacts/SHA256SUMS.txt --verify-tag --title "邮件接收管理 $env:RELEASE_VERSION" --notes-file docs/RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
